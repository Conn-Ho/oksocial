---
name: "oksocial image"

# Builds the amd64 image that social-ops-1 runs (ghcr.io/conn-ho/oksocial).
# Deploys build on oksocial-builder (deploy/build-and-deploy.sh); this stays as a manual fallback.
on:
  workflow_dispatch:

concurrency:
  group: oksocial-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/conn-ho/oksocial:latest
            ghcr.io/conn-ho/oksocial:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
